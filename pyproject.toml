[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "setlah"
version = "0.1.0rc1"
description = "A semi-declarative language for compiling combinatorial search models to ASP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "lark>=1.2",
    "egglog>=12.0,<13",
    "clingo==5.8.0",
    "cloudpickle>=3.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "twine>=5",
]

[project.scripts]
setlah = "setlah.cli:main"

[project.urls]
Repository = "https://github.com/yangdinglou/setlah"
Issues = "https://github.com/yangdinglou/setlah/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["setlah*"]

[tool.setuptools.package-data]
"setlah.parsing" = ["grammar.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
